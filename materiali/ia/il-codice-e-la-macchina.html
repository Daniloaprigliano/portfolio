<style>
/* Layout: un unico foglio miniato su cui la camera vola fra 25 tappe; lapis, oro e minio */
:root{
  --night:#0B1426; --lapis:#13254A; --lapis2:#1B3264; --vellum:#EDE6D6; --dim:#A9B3C6;
  --gold:#D4AF5A; --gold2:#F0D58E; --minium:#E0563B; --rule:rgba(212,175,90,.14);
  --serif:'Alegreya', Georgia, serif; --caps:'Alegreya Sans SC', 'Gill Sans', sans-serif; --sans:'Alegreya Sans', 'Gill Sans', sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--vellum);font-family:var(--serif);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%, #12223F 0%, var(--night) 70%)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.ruling{position:absolute;left:-4000px;top:-4000px;width:40000px;height:20000px;background:
  repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px 120px),
  repeating-linear-gradient(90deg, rgba(212,175,90,.06) 0 1px, transparent 1px 600px);pointer-events:none}
.section-title{position:absolute;font-family:var(--caps);font-size:150px;letter-spacing:18px;color:rgba(212,175,90,.22);white-space:nowrap;pointer-events:none}
.panel{position:absolute;width:1600px;height:900px;padding:90px 110px;background:linear-gradient(160deg,var(--lapis2),var(--lapis) 60%);border:2px solid rgba(212,175,90,.55);border-radius:6px;box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 0 0 14px rgba(11,20,38,.55), inset 0 0 0 15px rgba(212,175,90,.25);display:flex;flex-direction:column;gap:36px;overflow:hidden;cursor:pointer}
.panel .folio{position:absolute;right:46px;bottom:34px;font-family:var(--caps);font-size:24px;letter-spacing:4px;color:rgba(212,175,90,.7)}
.eyebrow{font-family:var(--caps);font-size:30px;letter-spacing:6px;color:var(--gold)}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
h1{font-size:104px;line-height:1.05}
h2{font-size:72px;line-height:1.1}
h3{font-size:42px;line-height:1.15;color:var(--gold2)}
p{margin:0}
.body{font-size:36px;line-height:1.4;color:var(--vellum)}
.muted{color:var(--dim)}
.sm{font-size:30px;line-height:1.4}
.min{color:var(--minium)} .gold{color:var(--gold2)}
.row{display:flex;gap:40px}
.col{display:flex;flex-direction:column;gap:18px;flex:1;min-width:0}
.card{background:rgba(11,20,38,.45);border:1px solid rgba(212,175,90,.3);border-radius:4px;padding:34px}
.grow{flex:1}
.initial{font-family:var(--serif);font-weight:700;color:var(--minium);float:left;font-size:300px;line-height:.8;margin:10px 30px 0 0;text-shadow:0 0 0 transparent;background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--minium));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.roman{font-family:var(--serif);font-size:64px;color:var(--minium);width:110px;flex:none}
/* entrate */
.panel [data-in]{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s ease}
.panel.on [data-in]{opacity:1;transform:none}
.panel.on [data-in="2"]{transition-delay:.35s}.panel.on [data-in="3"]{transition-delay:.7s}.panel.on [data-in="4"]{transition-delay:1.05s}.panel.on [data-in="5"]{transition-delay:1.4s}.panel.on [data-in="6"]{transition-delay:1.75s}
/* apparato: generazione */
.verse{font-size:66px;line-height:1.25;min-height:180px}
.verse .w{color:var(--gold2)}
.verse .cur{display:inline-block;width:.45em;border-bottom:4px solid var(--minium);margin-left:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.app{display:flex;flex-direction:column;gap:12px;min-height:280px}
.app .v{display:grid;grid-template-columns:300px 1fr 110px;align-items:center;gap:20px;font-size:34px}
.app .bar{height:26px;background:rgba(237,230,214,.08);border-radius:2px;overflow:hidden}
.app .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s ease}
.app .v.ch .bar i{background:var(--minium)}
.app .v.ch .t{color:var(--minium)}
.app .pc{text-align:right;color:var(--dim);font-family:var(--sans);font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:140px;top:300px;font-family:var(--caps);font-size:64px;letter-spacing:8px;color:var(--minium);border:5px solid var(--minium);padding:10px 28px;transform:rotate(-8deg) scale(1.6);opacity:0;transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.stamp.show{opacity:.9;transform:rotate(-8deg) scale(1)}
/* piramide */
.pyr{display:flex;flex-direction:column;align-items:center;gap:14px;width:780px;flex:none}
.brick{height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--caps);font-size:34px;letter-spacing:3px;color:#0B1426;border-radius:3px;transform:translateY(-900px);opacity:0;transition:transform .8s cubic-bezier(.3,1.4,.5,1), opacity .4s}
.brick small{font-family:var(--sans);font-size:24px;letter-spacing:0;opacity:.85}
.panel.on .brick{transform:none;opacity:1}
.b1{width:300px;background:#E0563B}.b2{width:460px;background:#E39A4C}.b3{width:620px;background:#D4AF5A}.b4{width:780px;background:#9FB58E}
.panel.on .b4{transition-delay:.2s}.panel.on .b3{transition-delay:.6s}.panel.on .b2{transition-delay:1s}.panel.on .b1{transition-delay:1.4s}
/* linea del tempo */
.tl{position:relative;height:430px;margin-top:20px}
.tl .line{position:absolute;left:0;right:0;top:120px;height:4px;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);transition:transform 1.6s ease}
.panel.on .tl .line{transform:scaleX(1)}
.tl .m{position:absolute;top:0;width:250px;opacity:0;transition:opacity .5s}
.panel.on .tl .m{opacity:1}
.tl .m .y{font-size:54px;color:var(--gold2);height:96px}
.tl .m .dot{width:26px;height:26px;border-radius:50%;background:var(--night);border:4px solid var(--gold);margin:-1px 0 24px}
.tl .m.key .dot{background:var(--minium);border-color:var(--minium)}
.tl .m.key .y{color:var(--minium)}
.tl .m p{font-size:28px;line-height:1.35;color:var(--dim)}
.tl .m h4{font-family:var(--caps);font-size:30px;letter-spacing:2px;margin:0 0 8px;color:var(--vellum);font-weight:700}
/* strati */
.layers{position:relative;height:520px}
.sheet{position:absolute;width:820px;height:360px;padding:34px 40px;border-radius:4px;border:1px solid rgba(212,175,90,.5);background:rgba(19,37,74,.92);box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0;transform:translateX(220px);transition:opacity .7s, transform .9s cubic-bezier(.2,.9,.3,1)}
.panel.on .sheet{opacity:1;transform:none}
.s1{left:0;top:0}.s2{left:190px;top:80px}.s3{left:380px;top:160px}
.panel.on .s2{transition-delay:.8s}.panel.on .s3{transition-delay:1.6s}
.sheet .eyebrow{font-size:26px}
/* corsie */
.lane{display:flex;align-items:center;gap:0;position:relative}
.lane .lab{width:250px;font-family:var(--caps);font-size:28px;letter-spacing:3px;color:var(--dim)}
.lane .node{flex:1;font-size:32px;line-height:1.3;padding:26px;border:1px solid rgba(212,175,90,.35);border-radius:4px;background:rgba(11,20,38,.45)}
.lane .pipe{width:90px;height:4px;background:rgba(212,175,90,.4);position:relative;overflow:visible}
.lane .pipe::after{content:"";position:absolute;top:-7px;left:0;width:18px;height:18px;border-radius:50%;background:var(--gold);animation:flow 2.4s linear infinite}
.lane.src .node{border-color:var(--gold);background:rgba(212,175,90,.1)}
.lane.src .lab{color:var(--gold2)}
@keyframes flow{from{transform:translateX(-10px);opacity:0}20%{opacity:1}80%{opacity:1}to{transform:translateX(82px);opacity:0}}
/* bilancia */
.beam{transform-origin:400px 120px;animation:none}
.panel.on .beam{animation:weigh 5s ease-in-out forwards}
@keyframes weigh{0%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(7deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}100%{transform:rotate(0)}}
/* fili */
.threads{position:absolute;left:0;top:0;pointer-events:none}
.threads path{fill:none;stroke-width:4;stroke-dasharray:1400;stroke-dashoffset:1400}
.claim,.src{position:absolute;font-size:28px;line-height:1.3;padding:20px 24px;border-radius:4px;background:rgba(11,20,38,.6);border:1px solid rgba(212,175,90,.35)}
.claim{width:640px}.src{width:420px;font-family:var(--sans)}
.claim b{font-family:var(--caps);font-weight:700;color:var(--gold);letter-spacing:2px;display:block;font-size:22px;margin-bottom:4px}
/* passi */
.steps{display:flex;gap:24px}
.step{flex:1;display:flex;flex-direction:column;gap:14px}
.step .n{font-size:84px;color:var(--minium);line-height:1}
.path{display:flex;align-items:stretch;gap:0}
.path .ph{flex:1;padding:26px 22px;border:1px solid rgba(212,175,90,.4);background:rgba(11,20,38,.45);display:flex;flex-direction:column;gap:8px}
.path .ph+ .ph{border-left:none}
.path .ph .h{font-family:var(--caps);color:var(--gold);font-size:24px;letter-spacing:2px}
.path .ph.noai{background:rgba(224,86,59,.14);border-color:var(--minium)}
table.rub{border-collapse:collapse;width:100%;font-size:32px}
table.rub td{padding:16px 18px;border-top:1px solid rgba(212,175,90,.3);vertical-align:top}
table.rub td:first-child{font-family:var(--caps);color:var(--minium);letter-spacing:2px;width:230px}
.biblio{columns:2;column-gap:70px;font-size:27px;line-height:1.4}
.biblio p{break-inside:avoid;margin:0 0 18px}
a{color:var(--gold2)}
/* interfaccia */
#hud{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:rgba(11,20,38,.82);border:1px solid rgba(212,175,90,.35);border-radius:999px;padding:8px 10px 8px 22px;font-family:var(--sans);font-size:15px;color:var(--dim);transition:opacity .6s;max-width:calc(100% - 32px)}
#hud.idle{opacity:0}
#hud .t{color:var(--vellum);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#hud button{font:inherit;color:var(--vellum);background:transparent;border:1px solid rgba(212,175,90,.35);border-radius:999px;padding:6px 12px;cursor:pointer}
#hud button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--gold);transition:width .6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

const W=1600,H=900,GX=300,GY=520;
const pos=[];
rows.forEach((r,ri)=>{const dir=ri%2===0?1:-1;r.forEach((idx,k)=>{const kk=dir===1?k:(r.length-1-k);const x=kk*(W+GX)+(ri%2?400:0);const y=ri*(H+GY);const rot=((idx*37)%5-2)*0.6;pos[idx]={x,y,rot};});});
panels.forEach((p,i)=>{const q=pos[i];p.style.left=q.x+'px';p.style.top=q.y+'px';p.style.transform=`rotate(${q.rot}deg)`;
 const f=document.createElement('span');f.className='folio';f.textContent=`c. ${i+1}${i%2?'v':'r'}`;p.appendChild(f);
 p.addEventListener('click',()=>{if(overview)go(i);});world.appendChild(p);
 if(p.dataset.sec){const t=document.createElement('div');t.className='section-title';t.textContent=p.dataset.sec;t.style.left=q.x+'px';t.style.top=(q.y-250)+'px';world.appendChild(t);}
});
const N=panels.length;let cur=0,overview=false;let cam={x:0,y:0,s:.1,r:0};
function fitFor(i){const v=innerWidth,h=innerHeight;const s=Math.min(v/(W*1.06),h/(H*1.06));const q=pos[i];return {x:q.x+W/2,y:q.y+H/2,s,r:-q.rot};}
function fitAll(){let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;pos.forEach(q=>{minx=Math.min(minx,q.x);miny=Math.min(miny,q.y-260);maxx=Math.max(maxx,q.x+W);maxy=Math.max(maxy,q.y+H);});const s=Math.min(innerWidth/((maxx-minx)*1.05),innerHeight/((maxy-miny)*1.08));return {x:(minx+maxx)/2,y:(miny+maxy)/2,s,r:0};}
function apply(c){world.style.transform=`translate(${innerWidth/2}px,${innerHeight/2}px) rotate(${c.r}deg) scale(${c.s}) translate(${-c.x}px,${-c.y}px)`;}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

 function step(t){let k=dur?Math.min(1,(t-t0)/dur):1;const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;const ls=Math.log(from.s)+(Math.log(to.s)-Math.log(from.s))*e;const s=Math.exp(ls)*(1-dip*Math.sin(Math.PI*e));
  cam={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,s,r:from.r+(to.r-from.r)*e};apply(cam);if(k<1)anim=requestAnimationFrame(step);else{anim=null;world.style.willChange='auto';done&&done();}}
 anim=requestAnimationFrame(step);}
function go(i){i=Math.max(0,Math.min(N-1,i));overview=false;panels.forEach(p=>p.classList.remove('on'));cur=i;hud();
 fly(fitFor(i),()=>{panels[i].classList.add('on');run(panels[i]);});

addEventListener('resize',()=>{cam=overview?fitAll():fitFor(cur);apply(cam);});
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();overview?go(cur):go(cur+1);}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1);}else if(e.key==='o'||e.key==='O'||e.key==='Escape'){overview?go(cur):showOverview();}else if(e.key==='f'||e.key==='F'){fs();}else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(N-1);}});

async function generate(p,data,token){const v=p.querySelector('.verse'),a=p.querySelector('.app');v.innerHTML='';const pre=document.createElement('span');v.appendChild(pre);

  a.querySelectorAll('.v')[pick].classList.add('ch');await sleep(700);
  const w=document.createElement('span');w.className='w';v.insertBefore(document.createTextNode(' '),cur);v.insertBefore(w,cur);for(const ch of st[pick][0]){w.textContent+=ch;await sleep(45);} }
 if(data===ARCH){const s=p.querySelector('.stamp');await sleep(500);s.classList.add('show');}}
function threads(p,token){const svg=p.querySelector('.threads');svg.innerHTML='';
 const cy=i=>i*135+50, sy=j=>j*108+40, cx=640, sx=960;
 const plan=[{c:0,wrong:0,right:1},{c:1,wrong:2,right:1},{c:2,wrong:null,right:3},{c:3,wrong:null,right:4}];
 const mk=(c,j,col,dash)=>{const pth=document.createElementNS('http://www.w3.org/2000/svg','path');const y1=cy(c),y2=sy(j);pth.setAttribute('d',`M${cx} ${y1} C ${cx+160} ${y1}, ${sx-160} ${y2}, ${sx} ${y2}`);pth.setAttribute('stroke',col);if(dash)pth.dataset.dash='1';svg.appendChild(pth);return pth;};
 const draw=(el,ms)=>{el.style.transition=`stroke-dashoffset ${ms}ms ease`;requestAnimationFrame(()=>{el.style.strokeDashoffset='0';});};
 (async()=>{for(const s of plan){if(p.dataset.tok!=token)return;
  if(s.wrong!==null){const w=mk(s.c,s.wrong,'#D4AF5A');draw(w,900);await sleep(1100);w.style.transition='stroke .3s, opacity .6s';w.setAttribute('stroke','#E0563B');w.style.strokeDasharray='10 14';w.style.strokeDashoffset='0';await sleep(500);w.style.opacity='.35';}
  const r=mk(s.c,s.right,s.right===4?'#E0563B':'#F0D58E');draw(r,900);await sleep(1200);} })();}
function run(p){const tok=String(Date.now());p.dataset.tok=tok;const a=p.dataset.anim;const st=p.querySelector('.stamp');if(st)st.classList.remove('show');
 if(a==='dante')generate(p,DANTE,tok);else if(a==='arch')generate(p,ARCH,tok);else if(a==='threads')threads(p,tok);}

const m=/^#c(\d+)$/.exec(location.hash);cur=m?Math.min(N-1,Math.max(0,+m[1]-1)):0;
cam=fitAll();apply(cam);hud();setTimeout(()=>go(cur),reduce?0:600);
})();
</script>
